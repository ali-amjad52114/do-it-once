<title>UX Concept Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800&family=Press+Start+2P&family=Gochi+Hand&display=swap">
<style>
/* Layout: concept board — each card = one interaction model (stage sketch + core loop / approval moment / strength / risk). Sticky pick bar. One committed light look. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#f1eee8; --ink:#1c1a24; --ink-soft:#57536a; --ink-faint:#8d8898; --edge:#1c1a24;
  --grape:#6b4ef6; --pink:#ff7ab6; --mint:#1fb48b; --sun:#ffc83d; --coral:#ff6b5a; --sky:#4f9dff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif; --body:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{margin:6px 0 0;color:var(--ink-soft);max-width:68ch}
.mock{font-size:12px;color:var(--ink-faint);border:1.5px dashed var(--ink-faint);border-radius:999px;padding:3px 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;font-weight:800;border:2px solid var(--edge);border-radius:999px;padding:4px 12px;background:var(--panel);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:20px;box-shadow:3px 3px 0 var(--edge);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--edge)}
.card:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.card.sel{box-shadow:5px 5px 0 var(--edge),0 0 0 4px var(--grape)}
.stage{border-bottom:2px solid var(--edge);line-height:0}
.stage svg{width:100%;height:auto;display:block}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.info h3{font-size:19px}
.tag{font-size:11px;font-weight:800;border:1.5px solid var(--edge);border-radius:999px;padding:1px 8px;white-space:nowrap}
.pitch{margin:0;font-size:13.5px;color:var(--ink)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}
dt{font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding-top:2px}
dd{margin:0;color:var(--ink-soft)}
.pickbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:3px 3px 0 var(--grape);max-width:calc(100% - 32px);z-index:3}
.pickbar code{background:#2d2a3a;border-radius:8px;padding:4px 8px;font-size:13px;color:#e9e4ff;user-select:all}
.pickbar button{font:inherit;font-size:13px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="intro">
    <div>
      <h1>Twelve ways the app could work</h1>
      <p>Each card is a different interaction model, not a different skin: a different home screen, a different everyday loop, and a different moment where you approve the irreversible step.</p>
    </div>
    <span class="mock">Mockup · concept sketches</span>
  </div>
  <div class="filters" role="group" aria-label="Filter by feel">
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="Game">Game</button>
    <button type="button" data-f="Calm">Calm</button>
    <button type="button" data-f="Fast">Fast</button>
    <button type="button" data-f="Social">Story</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="pickbar" role="status" aria-live="polite"><span>Your pick:</span><code id="pick">Build the Pocket pet concept</code><button id="copy" type="button">Copy</button></div>

  var sel='pet',filter='all';
  function render(){
    document.getElementById('grid').innerHTML=C.filter(function(c){return filter==='all'||c.f===filter}).map(function(c){
      return '<div class="card'+(c.id===sel?' sel':'')+'" role="button" tabindex="0" data-id="'+c.id+'" aria-pressed="'+(c.id===sel)+'">'+
        '<div class="stage">'+c.s()+'</div><div class="info"><div class="top"><h3>'+c.name+'</h3><span class="tag">'+c.tag+'</span></div>'+
        '<p class="pitch">'+c.pitch+'</p><dl><dt>Loop</dt><dd>'+c.loop+'</dd><dt>Approve</dt><dd>'+c.ok+'</dd><dt>Strong</dt><dd>'+c.str+'</dd><dt>Risk</dt><dd>'+c.risk+'</dd></dl></div></div>';
    }).join('');
    var cur=C.filter(function(c){return c.id===sel})[0];
    document.getElementById('pick').textContent='Build the '+cur.name+' concept';
  }
  var g=document.getElementById('grid');
  function choose(id){sel=id;render();var n=document.querySelector('[data-id="'+id+'"]');if(n)n.focus({preventScroll:true})}
  g.addEventListener('click',function(e){var c=e.target.closest('[data-id]');if(c)choose(c.getAttribute('data-id'))});
  g.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id]')){e.preventDefault();choose(e.target.getAttribute('data-id'))}});
  document.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){filter=b.getAttribute('data-f');document.querySelectorAll('[data-f]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});render()})});
  document.getElementById('copy').addEventListener('click',function(){var b=this,t=document.getElementById('pick').textContent;
    try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copied'},function(){b.textContent='Select it'})}catch(err){b.textContent='Select it'}
    setTimeout(function(){b.textContent='Copy'},1800)});
  render();
})();
