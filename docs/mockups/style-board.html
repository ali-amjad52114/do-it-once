<title>Art Style Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@600;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fredoka:wght@500;700&family=Gochi+Hand&family=Lilita+One&family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800&family=Orbitron:wght@700;900&family=Outfit:wght@500;800&family=Press+Start+2P&family=Silkscreen&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Layout: a style casting board — intro, then a grid of large cards; each card's stage is the same scene (buddy vs. the $19 bill) drawn in a different art style. Sticky pick bar at the bottom. One committed light look for the page chrome. */
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1c1a24; --ink-soft:#5a5666; --ink-faint:#8d8898; --edge:#1c1a24; --pick:#6b4ef6;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif; --body:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.intro h1{font-size:clamp(28px,4vw,40px)}
.intro p{margin:6px 0 0;color:var(--ink-soft);max-width:64ch}
.mock{font-size:12px;color:var(--ink-faint);border:1.5px dashed var(--ink-faint);border-radius:999px;padding:3px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:20px;box-shadow:3px 3px 0 var(--edge);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--edge)}
.card:focus-visible{outline:3px solid var(--pick);outline-offset:3px}
.card.sel{box-shadow:5px 5px 0 var(--edge),0 0 0 4px var(--pick)}
.stage{border-bottom:2px solid var(--edge);line-height:0}
.stage svg{width:100%;height:auto;display:block}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.info .like{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.info h3{font-size:19px}
.info p{margin:0;font-size:13px;color:var(--ink-soft)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw{display:flex;gap:4px}
.sw i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--edge);display:block}
.fit{font-size:11px;font-weight:800;border:1.5px solid var(--edge);border-radius:999px;padding:1px 8px}
.pickbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:3px 3px 0 var(--pick);max-width:calc(100% - 32px);z-index:3}
.pickbar code{background:#2d2a3a;border-radius:8px;padding:4px 8px;font-size:13px;color:#e9e4ff;user-select:all}
.pickbar button{font:inherit;font-size:13px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="intro">
    <div>
      <h1>Pick an art style</h1>
      <p>Same scene in every card: your brain buddy and a $19-a-month bill monster. Only the art style changes. Tap a card to choose it.</p>
    </div>
    <span class="mock">Mockup · original art, style references only</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="pickbar" role="status" aria-live="polite"><span>Your pick:</span><code id="pick">Build it in Creature card style</code><button id="copy" type="button">Copy</button></div>

  ];

  var sel='creature';
  function render(){
    document.getElementById('grid').innerHTML=STYLES.map(function(s){
      return '<div class="card'+(s.id===sel?' sel':'')+'" role="button" tabindex="0" data-id="'+s.id+'" aria-pressed="'+(s.id===sel)+'">'+
        '<div class="stage">'+s.s()+'</div>'+
        '<div class="info"><span class="like">Feels like: '+s.like+'</span><h3>'+s.name+'</h3><p>'+s.p+'</p>'+
        '<div class="meta"><div class="sw" aria-label="Palette">'+s.sw.map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+'</div><span class="fit">Vibe: '+s.fit+'</span></div></div></div>';
    }).join('');
    var cur=STYLES.filter(function(s){return s.id===sel})[0];
    document.getElementById('pick').textContent='Build it in '+cur.name+' style';
  }
  function choose(id){sel=id;render();var n=document.querySelector('[data-id="'+id+'"]');if(n)n.focus({preventScroll:true})}
  var g=document.getElementById('grid');
  g.addEventListener('click',function(e){var c=e.target.closest('[data-id]');if(c)choose(c.getAttribute('data-id'))});
  g.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id]')){e.preventDefault();choose(e.target.getAttribute('data-id'))}});
  document.getElementById('copy').addEventListener('click',function(){var b=this,t=document.getElementById('pick').textContent;
    try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copied'},function(){b.textContent='Select it'})}catch(err){b.textContent='Select it'}
    setTimeout(function(){b.textContent='Copy'},1800)});
  render();
})();
</script>
